<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TITAN AGENT — Ingreso</title>
<meta name="theme-color" content="#0f1720">
<style>
  :root {
    --bg: #0f1720; --card: #16212c; --card2: #1c2b38; --border: #253544;
    --text: #e6edf3; --muted: #8a9bb0; --y: #FFD100; --y-hover: #e6bc00;
    --danger: #ef4444; --r: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .box { width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 32px; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .logo { width: 34px; height: 34px; background: var(--y); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; color: #000; }
  h1 { font-size: 16px; font-weight: 700; color: var(--y); letter-spacing: 1.5px; text-transform: uppercase; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%; padding: 10px 12px; background: var(--card2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--y); }
  button {
    width: 100%; margin-top: 22px; padding: 11px; background: var(--y); color: #000;
    border: none; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer;
    letter-spacing: 0.5px; transition: background .2s;
  }
  button:hover { background: var(--y-hover); }
  button:disabled { opacity: .6; cursor: default; }
  .error { color: var(--danger); font-size: 12px; margin-top: 12px; min-height: 14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo-row">
      <div class="logo">T</div>
      <h1>TITAN AGENT</h1>
    </div>
    <div class="sub">Ingresa con tu usuario para continuar</div>
    <form id="loginForm">
      <label>Usuario</label>
      <input id="username" autocomplete="username" required autofocus />
      <label>Contraseña</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div class="error" id="errorMsg"></div>
      <button id="submitBtn" type="submit">Ingresar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Ingresando...';
      try {
        const resp = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error || 'Error al ingresar');
        location.href = '/';
      } catch (err) {
        errorMsg.textContent = err.message;
        submitBtn.disabled = false;
        submitBtn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
